<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Guess My Number" />
    <meta property="og:description" content="A number guessing game built with HTML, CSS and JavaScript. Guess the secret number between 1 and 20 with hints and a high score." />
    <meta property="og:url" content="https://mhmd7710d.github.io/Guess-My-Number-Game/" />
    <meta property="og:image" content="https://mhmd7710d.github.io/Guess-My-Number-Game/preview.jpg" />

    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <header>
      <h1>Guess My Number!</h1>
      <p class="between">(Between 1 and 20)</p>
      <button class="btn again">Again!</button>
      <div class="number">?</div>
    </header>
    <main>
      <section class="left">
        <input type="number" class="guess" />
        <button class="btn check">Check!</button>
      </section>
      <section class="right">
        <p class="message">Start guessing...</p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-highscore">
          🥇 Highscore: <span class="highscore">0</span>
        </p>
      </section>
    </main>
    <script src="script.js"></script>
